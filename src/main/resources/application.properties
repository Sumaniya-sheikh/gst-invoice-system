
spring.application.name=gst-invoice-system

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/gst_invoice_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.gstcompliance=INFO

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password reset token validity (minutes)
app.password-reset.expiry-minutes=15

# Email verification token validity (minutes)
app.email-verification.expiry-minutes=30

# Frontend links used in verification and password-reset emails
app.frontend-url=http://localhost:5173

# Demo business GSTIN (for academic testing only)
app.business.gstin=09ABCDE1234F1Z5
